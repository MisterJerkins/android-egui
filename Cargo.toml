[package]
name = "android-egui"
version = "0.2.0"
edition = "2024"
description = "egui overlay for Android drawn from a root binary through SurfaceFlinger"
license = "MIT"
publish = false

[lib]
name = "android_egui"

[[bin]]
name = "android-egui"
path = "src/main.rs"

[features]
default = ["helper"]
# The Java helper run by app_process: system clipboard, touches where no touchscreen can be
# read, and keeping the screen awake in control mode. Without it the binary carries no dex.
helper = []

[dependencies]
egui ={ version = "=0.37.0", default-features = false, features = ["default_fonts", "bytemuck"] }
bytemuck = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"
egui_glow = { version = "=0.37.0", default-features = false }
ash = { version = "0.38", default-features = false, features = ["loaded", "std"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
panic = "abort"
